version: '3'

vars:
  BIN: '{{.ROOT_DIR}}/bin/spectre'
  DEMO_DIR: '{{.ROOT_DIR}}/bin/demo'

tasks:
  default:
    desc: List tasks
    silent: true
    cmds:
      - task --list

  run:
    desc: Run the spec viewer (DIR, PORT)
    silent: true
    aliases: [dev, 'demo:spec']
    deps: [build]
    vars:
      DIR: '{{.DIR | default (printf "%s/spec" .DEMO_DIR)}}'
      PORT: '{{.PORT | default "0"}}'
    cmds:
      - |
          if [ {{.DIR | shellQuote}} = {{printf "%s/spec" .DEMO_DIR | shellQuote}} ]; then
            mkdir -p {{.DIR | shellQuote}}
            for demo_source in internal/spec/testdata/atc-spec/*.md; do
              demo_target={{.DIR | shellQuote}}/"${demo_source##*/}"
              test -e "$demo_target" || cp "$demo_source" "$demo_target"
            done
          fi
          exec {{.BIN | shellQuote}} spec -dir {{.DIR | shellQuote}} -port {{.PORT | shellQuote}}

  run:audit:
    desc: Run the audit viewer (PROJECT, PORT)
    silent: true
    aliases: ['demo:audit']
    deps: [build]
    vars:
      PROJECT: '{{.PROJECT | default (printf "%s/project" .DEMO_DIR)}}'
      PORT: '{{.PORT | default "0"}}'
    cmds:
      - |
          if [ {{.PROJECT | shellQuote}} = {{printf "%s/project" .DEMO_DIR | shellQuote}} ]; then
            export AUDIT_REPORT_HOME={{printf "%s/index" .DEMO_DIR | shellQuote}}
            export XDG_CACHE_HOME={{printf "%s/cache" .DEMO_DIR | shellQuote}}
            mkdir -p {{.PROJECT | shellQuote}}
            {{.BIN | shellQuote}} audit init --project {{.PROJECT | shellQuote}} --source internal/audit/testdata/example/report.json >/dev/null
          fi
          exec {{.BIN | shellQuote}} audit view --project {{.PROJECT | shellQuote}} --port {{.PORT | shellQuote}}

  build:
    desc: Build bin/spectre
    run: once
    env:
      CGO_ENABLED: '0'
    cmds:
      - go build -o {{.BIN | shellQuote}} ./cmd/spectre

  format:
    desc: Format Go code
    cmds:
      - gofmt -w cmd internal docs/audit

  format:check:
    desc: Check Go formatting
    cmds:
      - |
          files=$(gofmt -l cmd internal docs/audit)
          if [ -n "$files" ]; then
            printf 'gofmt needed:\n%s\n' "$files"
            exit 1
          fi

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  test:
    desc: Run Go tests (PACKAGES, optional arguments after --)
    deps: [build]
    vars:
      PACKAGES: '{{.PACKAGES | default "./..."}}'
    env:
      SPECTRE_BINARY: '{{.BIN}}'
    cmds:
      - go test -race {{.PACKAGES}} {{.CLI_ARGS}}

  test:audit:
    desc: Run audit and CLI tests
    cmds:
      - task: test
        vars:
          PACKAGES: './internal/audit ./cmd/spectre'

  test:fuzz:
    desc: Fuzz feedback parsing
    cmds:
      - go test ./internal/audit -run '^$' -fuzz '^FuzzFeedbackBoundary$' -fuzztime=5s -parallel=2

  test:browser:
    desc: Run browser tests with Linux Chromium (BROWSER)
    aliases: ['check:browser']
    deps: [build]
    requires:
      vars: [BROWSER]
    preconditions:
      - sh: test -x {{.BROWSER | shellQuote}}
        msg: BROWSER must point to a Linux Chromium executable
      - sh: node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
        msg: Browser tests require Node 22
    cmds:
      - node scripts/check-browser.mjs {{.BROWSER | shellQuote}} {{.BIN | shellQuote}}

  benchmark:audit:
    desc: Benchmark report linting
    cmds:
      - go test ./internal/audit -run '^$' -bench '^BenchmarkLintReport$' -benchmem -count=3 -benchtime=500ms

  demos:
    desc: Record spec and audit GIFs for the README (BROWSER)
    deps: [build]
    requires:
      vars: [BROWSER]
    preconditions:
      - sh: test -x {{.BROWSER | shellQuote}}
        msg: BROWSER must point to Linux Chromium
      - sh: node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
        msg: Demo recording requires Node 22
      - sh: command -v ffmpeg && command -v ffprobe
        msg: Demo recording requires FFmpeg and ffprobe
    cmds:
      - node scripts/record-demos.mjs {{.BROWSER | shellQuote}} {{.BIN | shellQuote}} docs/demos

  demos:inspect:
    desc: Make GIF contact sheets in bin/demo-previews for visual review
    preconditions:
      - sh: command -v ffmpeg
        msg: Contact sheets require FFmpeg
      - sh: test -f docs/demos/spec-review.gif && test -f docs/demos/audit-review.gif
        msg: Run task demos first
    cmds:
      - mkdir -p bin/demo-previews
      - ffmpeg -v error -i docs/demos/spec-review.gif -vf 'fps=1/3,scale=512:-1,tile=3x2' -frames:v 1 -y bin/demo-previews/spec-review.png
      - ffmpeg -v error -i docs/demos/audit-review.gif -vf 'fps=1/3,scale=512:-1,tile=3x2' -frames:v 1 -y bin/demo-previews/audit-review.png

  audit:check:
    desc: Validate bundled audit reports
    deps: [build]
    cmds:
      - '{{.BIN | shellQuote}} audit build internal/audit/testdata/example/report.json --check --strict'
      - '{{.BIN | shellQuote}} audit build docs/audit/templates/report.starter.json --check --strict'

  skill:check:
    desc: Validate skills (VALIDATOR)
    requires:
      vars: [VALIDATOR]
    preconditions:
      - sh: test -f {{.VALIDATOR | shellQuote}}
        msg: VALIDATOR must point to skill-creator/scripts/quick_validate.py
    cmds:
      - python3 {{.VALIDATOR | shellQuote}} .
      - python3 {{.VALIDATOR | shellQuote}} docs/audit

  vuln:
    desc: Check Go vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  verify:
    desc: Run all Go checks
    cmds:
      - task: format:check
      - task: lint
      - task: test
      - task: audit:check
      - task: vuln
